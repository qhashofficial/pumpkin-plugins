name: Sync GitHub labels

on:
    push:
        branches:
            - master
        paths:
            - .github/labels.yml

concurrency:
    group: sync-labels-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        name: 🏷️ Sync label catalog
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🔑 Create label sync token
              id: app-token
              uses: actions/create-github-app-token@v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-issues: write

            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: ⚙️ Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🔧 Setup Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 📦 Install catalog parser dependency
              run: pnpm install --filter pumpkin-plugins --frozen-lockfile --ignore-scripts

            - name: 🧽 Create standard label manifest
              run: node .github/scripts/coderabbit-labels.mjs --manifest "$RUNNER_TEMP/labels-for-sync.yml"

            - name: 🏷️ Sync repository labels
              uses: EndBug/label-sync@v2.3.3
              with:
                  config-file: ${{ runner.temp }}/labels-for-sync.yml
                  token: ${{ steps.app-token.outputs.token }}
                  delete-other-labels: false
