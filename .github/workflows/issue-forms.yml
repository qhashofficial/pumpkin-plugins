name: Issue form validation

on:
    pull_request:
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/**'
            - '.github/workflows/issue-forms.yml'
            - '.github/common/bootstrap/**'
            - '.github/labels.yml'
    push:
        branches:
            - master
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/**'
            - '.github/workflows/issue-forms.yml'
            - '.github/common/bootstrap/**'
            - '.github/labels.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: 📝 Validate issue forms
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Validate issue form definitions
              run: node .github/scripts/validate-issue-forms.mjs

            - name: 🧪 Test issue intake rules
              run: node --test .github/scripts/*.test.mjs
